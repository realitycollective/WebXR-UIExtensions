# WebXR UI Extensions — package + publish ALL FOUR packages to GitHub
# (Packages registry + a GitHub Release with the tarballs attached).
#
# Single-purpose repo: the root IS the npm workspace root, so every path below
# is relative to it and `packages/*` are the publishable libraries.
#
# Publishing is limited to GitHub for now — no npmjs.com. When the packages
# graduate to the public npm registry, add an npm job alongside these — same
# build/pack steps, plus `--provenance`.
#
# Manual dispatch only. Defaults to a DRY RUN (build + pack + artifacts, no
# registry push, no release) so the pipeline can be exercised safely.
#
# GitHub Packages scope constraint: the npm registry at npm.pkg.github.com
# only accepts packages scoped to the repository owner. Under the
# `realitycollective` org the packages already carry that scope, so the
# re-scoping step below is a no-op — it stays so a fork or a personal-account
# run still publishes successfully.
#
# Consumers need a SCOPED registry entry, NOT `--registry=`: that flag
# redirects the whole install and 404s on the npmjs-hosted dependencies
# (@pmndrs/*, qrcode-terminal), which GitHub Packages does not proxy.
# In the consuming project's .npmrc:
#   @realitycollective:registry=https://npm.pkg.github.com
#   //npm.pkg.github.com/:_authToken=<token with read:packages>
# then:
#   npm install @realitycollective/webxr-uiextensions
# Note GitHub Packages requires a token to READ, even for public packages —
# one reason the npmjs.com move is still on the table.
#
# The GitHub Release tarballs need no registry and no token:
#   npm install https://github.com/<owner>/<repo>/releases/download/uix-v<ver>/<tarball>.tgz

name: WebXR UIExtensions Publish (GitHub)

on:
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Dry run (build + pack only — no registry publish, no release)"
        type: boolean
        default: true
      createRelease:
        description: "Create/refresh the GitHub Release with the tarballs"
        type: boolean
        default: true

permissions:
  contents: write # create the release + tag
  packages: write # publish to GitHub Packages


jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The demos and tests all resolve the libraries to packages/<name>/src,
      # so nothing above this line exercises the built artifact. This packs,
      # installs into a clean project and imports — the gate that catches a
      # package which builds green but ships broken.
      - name: Verify the published artifact is consumable
        run: npm run verify:pack -- --skip-build

      # LICENSE is committed in each package; the shared CHANGELOG is not, so
      # it is copied in at pack time to ship with every tarball.
      - name: Copy CHANGELOG into the packages
        run: |
          for dir in packages/webxr-uiextensions packages/iwsdk-uiextensions packages/xrblocks-uiextensions packages/uix-devtools; do
            cp CHANGELOG.md "$dir/CHANGELOG.md" 2>/dev/null || true
          done

      - name: Pack (always — the artifacts are the receipt)
        run: |
          mkdir -p dist-tarballs
          npm pack --workspace @realitycollective/webxr-uiextensions --pack-destination dist-tarballs
          npm pack --workspace @realitycollective/iwsdk-uiextensions --pack-destination dist-tarballs
          npm pack --workspace @realitycollective/xrblocks-uiextensions --pack-destination dist-tarballs
          npm pack --workspace @realitycollective/uix-devtools --pack-destination dist-tarballs
          ls -l dist-tarballs

      - name: Upload tarball artifacts
        uses: actions/upload-artifact@v7
        with:
          name: uix-package-tarballs
          path: dist-tarballs/*.tgz
          if-no-files-found: error

      - name: Publish to GitHub Packages (re-scoped to repo owner)
        if: ${{ inputs.dryRun == false }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          OWNER_LC="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          for dir in packages/webxr-uiextensions packages/iwsdk-uiextensions packages/xrblocks-uiextensions packages/uix-devtools; do
            workdir="$(mktemp -d)"
            cp -r "$dir/." "$workdir/"
            node -e "
              const fs = require('fs');
              const path = '$workdir/package.json';
              const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
              pkg.name = pkg.name.replace(/^@[^/]+\//, '@' + '$OWNER_LC' + '/');
              for (const depType of ['dependencies', 'peerDependencies']) {
                if (!pkg[depType]) continue;
                for (const dep of Object.keys(pkg[depType])) {
                  if (!dep.startsWith('@realitycollective/')) continue;
                  const rescoped = dep.replace(/^@[^/]+\//, '@' + '$OWNER_LC' + '/');
                  pkg[depType][rescoped] = pkg[depType][dep];
                  delete pkg[depType][dep];
                }
              }
              pkg.publishConfig = { registry: 'https://npm.pkg.github.com' };
              fs.writeFileSync(path, JSON.stringify(pkg, null, 2));
              console.log('publishing as', pkg.name, pkg.version);
            "
            (cd "$workdir" && npm publish) || echo "::warning::publish failed for $dir (already published at this version?)"
          done

      - name: Create GitHub Release with tarballs
        if: ${{ inputs.dryRun == false && inputs.createRelease == true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./packages/webxr-uiextensions/package.json').version")"
          TAG="uix-v${VERSION}"
          NOTES="WebXR UI Extensions ${VERSION} — core + IWSDK/XR Blocks adapters + devtools.

          Install straight from this release:
          \`npm install <asset-url>.tgz\`

          Or from GitHub Packages — add this line to your .npmrc first:
          \`@${{ github.repository_owner }}:registry=https://npm.pkg.github.com\`
          then \`npm install @${{ github.repository_owner }}/webxr-uiextensions\`"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-tarballs/*.tgz --clobber --repo "${{ github.repository }}"
          else
            gh release create "$TAG" dist-tarballs/*.tgz \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "WebXR UI Extensions ${VERSION}" \
              --notes "$NOTES"
          fi

      - name: Summary
        env:
          DRY: ${{ inputs.dryRun }}
        run: |
          LIB_VERSION="$(node -p "require('./packages/webxr-uiextensions/package.json').version")"
          DEV_VERSION="$(node -p "require('./packages/uix-devtools/package.json').version")"
          {
            echo "## WebXR UI Extensions publish"
            echo ""
            echo "| package | version |"
            echo "| --- | --- |"
            echo "| @realitycollective/webxr-uiextensions | $(node -p "require('./packages/webxr-uiextensions/package.json').version") |"
            echo "| @realitycollective/iwsdk-uiextensions | ${LIB_VERSION} |"
            echo "| @realitycollective/xrblocks-uiextensions | $(node -p "require('./packages/xrblocks-uiextensions/package.json').version") |"
            echo "| @realitycollective/uix-devtools | ${DEV_VERSION} |"
            echo ""
            if [ "$DRY" = "true" ]; then
              echo "**DRY RUN** — packed but not published. Re-run with dryRun=false to push to GitHub Packages and cut the release."
            else
              echo "Published to GitHub Packages (as @${{ github.repository_owner }}/*) and release \`uix-v${LIB_VERSION}\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
